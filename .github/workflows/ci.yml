name: Hospital Management System CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install demo dependencies
        run: pip install -r requirements-dev.txt
      - name: Run demo tests
        run: pytest -q
      - name: Check Python syntax
        run: python -m compileall -q app.py hospital_demo.py tests
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: Lint PHP syntax in original project
        run: |
          find DBMS_18CSC303J_Hospital-management-system-main -name '*.php' -print0 | xargs -0 -n1 php -l
